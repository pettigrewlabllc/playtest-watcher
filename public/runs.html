<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona runs</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  button, select { font: inherit; background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 6px 12px; }
  .muted { color: #999; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .intro { color: #ccc; max-width: 900px; margin: 0 0 12px; line-height: 1.45; }
  .label { font-size: 12px; text-transform: none; color: #8a8a8a; margin: 10px 0 4px; font-weight: 600; }
  .sum { color: #ddd; font-size: 14px; margin: 8px 0; line-height: 1.45; }
  .legend { display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; margin-top: 6px; }
  .lim { cursor: help; }
  .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 12px; }
  .side { background: #181818; border: 1px solid #2a2a2a; border-radius: 8px; padding: 12px; }
  .card h2 { font-size: 17px; margin: 0 0 4px; }
  .card ul { margin: 6px 0; padding-left: 18px; color: #ccc; font-size: 14px; }
  .lims { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .lim { background: #222; border: 1px solid #333; border-radius: 6px; padding: 4px 8px; font-size: 13px; }
  .lim b { color: #fff; }
  .shot { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px; margin-top: 10px; align-items: start; }
  .shot img { width: 200px; border-radius: 8px; background: #000; display: block; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 13px; color: #111; font-weight: 600; }
  .say { font-size: 17px; margin: 8px 0; }
  .meta { font-size: 13px; color: #aaa; margin: 4px 0; }
  .miss { color: #fca5a5; }
  .strip { display: flex; gap: 2px; margin-top: 10px; height: 14px; }
  .strip span { flex: 1; border-radius: 2px; cursor: pointer; opacity: .8; }
  .strip span.on { outline: 2px solid #fff; opacity: 1; }
  .side select { max-width: 100%; }
  .side { min-width: 0; }
  @media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .shot { grid-template-columns: 1fr; } .shot img { width: 100%; max-width: 280px; } }
</style>
</head>
<body>
<h1>Persona runs</h1>
<p class="intro">Each side is an AI playing the game as one kid. It's held to that kid's limits: how long they look before tapping, how fast they go, how much they read, how often they miss. Step through to see what it saw, what it did and what it said.</p>
<div class="row">
  <button id="prev">◀</button><button id="play">Play both</button><button id="next">▶</button>
  <span id="at" class="muted"></span>
</div>
<div class="legend" id="legend"></div>
<div class="cols">
  <div class="side"><select id="pickA"></select><div id="A"></div></div>
  <div class="side"><select id="pickB"></select><div id="B"></div></div>
</div>
<script>
const COLORS = { confused: '#fbbf24', stuck: '#fb923c', frustrated: '#f87171', bored: '#9ca3af', focused: '#60a5fa', engaged: '#4ade80', delighted: '#f472b6', none: '#555' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const runs = { A: null, B: null };
// ?public hides ages: next to the letters they tell anyone who knows the family which kid is which.
const PUBLIC = new URLSearchParams(location.search).has('public');
let step = 0, timer = null;

const LIMITS = [
  ['firstTapS', 'first tap', x => `${x.toFixed(1)} s`, 'How long they look at a new screen before they tap anything'],
  ['actionGapS', 'between taps', x => `${x.toFixed(1)} s`, 'How long between taps once they get going'],
  ['readShare', 'reads', x => `${Math.round(x * 100)}%`, 'How much of the instructions they actually read. The rest is hidden from the AI'],
  ['errorRate', 'misses', x => `${Math.round(x * 100)}%`, 'How often a tap lands on the button next to the one they meant'],
  ['sourAfterFails', 'sours after', x => `${x} fails`, 'How many fails in a row before they get frustrated'],
];

const REFLEX = [
  ['reactionMs', 'reacts in', x => `${x} ms`, 'Nothing it plans can happen sooner than this after it looks. A default for the age, not measured'],
  ['timingSdMs', 'timing off by', x => `±${x} ms`, 'How far its moves land from when it meant them. A default for the age, not measured'],
  ['missRate', 'freezes on', x => `${Math.round(x * 100)}%`, 'Share of planned moves that never happen. Measured: numbers the kid let fall in Factor Slicer'],
];

function card(r) {
  const h = r.harness;
  const action = r.mode === 'action';
  const rules = r.rules.split('\n').filter(l => l.startsWith('- ')).map(l => `<li>${esc(l.slice(2))}</li>`).join('');
  const steps = r.steps, n = steps.length || 1;
  const mix = {};
  for (const s of steps) mix[s.label] = (mix[s.label] ?? 0) + 1;
  const top = Object.entries(mix).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([l, c]) => `${l} ${Math.round((100 * c) / n)}%`).join(', ');
  const missed = steps.filter(s => s.missed).length, skipped = new Set(steps.flatMap(s => s.skipped ?? [])).size, stop = steps.filter(s => s.would_quit).length;
  const froze = steps.flatMap(s => s.timed ?? []).filter(m => m.skipped).length, moves = steps.flatMap(s => s.timed ?? []).length;
  const last = steps.at(-1)?.state, stumbles = steps.filter(s => s.state?.stumble).length;
  const mins = steps.length ? (steps.at(-1).t / 60).toFixed(1) : '0';
  const described = /^Described/.test(r.observer ?? '');
  return `<div class="card"><h2>Player ${esc(r.letter)}${r.age && !PUBLIC ? `, age ${r.age}` : ''}</h2>
    <div class="muted">${described ? 'Described in one sentence, not measured.' : 'Built from their recorded play.'} Playing ${esc(r.game)}.</div>
    <div class="label">Their limits (hover for what each one means)</div>
    <div class="lims">${action && r.reflex
      ? REFLEX.map(([k, name, f, tip]) => `<span class="lim" title="${esc(tip)}">${name} <b>${f(r.reflex[k])}</b></span>`).join('')
      : LIMITS.map(([k, name, f, tip]) => `<span class="lim" title="${esc(tip)}">${name} <b>${f(h[k])}</b></span>`).join('')}</div>
    <div class="label">Rules it plays by</div><ul>${rules}</ul>
    <div class="label">How the run went</div>
    <div class="sum">${action
      ? `${steps.length} looks, ${mins} minutes of game time. Mostly ${esc(top)}. Planned ${moves} moves and froze on ${froze}.${stumbles ? ` Stumbling at ${stumbles} look${stumbles === 1 ? '' : 's'}.` : ''}${last?.over ? ` The run ended: ${esc(last.over)}.` : ''}`
      : `${steps.length} steps, ${mins} minutes of game time. Mostly ${esc(top)}. Missed ${missed} tap${missed === 1 ? '' : 's'}, ${skipped ? `skipped ${skipped} thing${skipped === 1 ? '' : 's'} it didn't read` : 'read everything'}${stop ? `, and wanted to stop ${stop} time${stop === 1 ? '' : 's'}` : ''}.`}</div>
    </div><div class="label">Every step, colored by how it felt (click one to jump there)</div><div class="strip"></div><div class="body"></div>`;
}

function show(side) {
  const r = runs[side], el = document.getElementById(side);
  if (!r) return;
  const s = r.steps[Math.min(step, r.steps.length - 1)];
  const body = el.querySelector('.body');
  if (!s) { body.innerHTML = '<p class="muted">No steps.</p>'; return; }
  const done = step >= r.steps.length;
  body.innerHTML = `<div class="shot"><img src="/shots/${encodeURIComponent(r.id)}/${String(s.n).padStart(3, '0')}.jpg" alt="Game screen at step ${s.n}">
    <div><div><span class="pill" style="background:${COLORS[s.label] ?? '#555'}" title="${s.forced ? 'Set by the kid\'s fail limit, not by the AI' : 'How the AI said it felt'}">${esc(s.label)}${s.forced ? ' (by the limit)' : ''}</span> <span class="muted">step ${s.n}, ${s.t.toFixed(1)} s into the game${done ? ' (its last step)' : ''}</span></div>
    <div class="label">What it said</div>
    ${s.say ? `<div class="say">“${esc(s.say)}”</div>` : `<div class="meta">${esc(s.why)}</div>`}
    <div class="label">What it did</div>
    ${s.timed ? `<div class="meta">${s.timed.length ? s.timed.map(m => `${m.kind === 'hold' ? `held ${esc(m.key)}` : m.kind === 'tap' ? `tapped ${esc(m.target || 'a button')}` : `pressed ${esc(m.key)}`}: meant ${m.at_ms} ms, ${m.skipped ? '<span class="miss">froze, never did it</span>' : `did it at ${m.fire_ms} ms`}`).join('<br>') : 'Nothing'}</div>` : `<div class="meta">${s.action === 'tap' ? `Tapped <b>${esc(s.target)}</b>` : s.action === 'wait' ? 'Waited' : esc(s.action)}${s.missed ? ` <span class="miss">(meant ${esc(s.intended)}, missed)</span>` : ''}${s.would_quit ? '. Wanted to stop.' : ''}</div>`}
    ${s.skipped?.length ? `<div class="label">What it didn't read</div><div class="meta">${s.skipped.map(t => `“${esc(t.slice(0, 40))}…”`).join(', ')}</div>` : ''}
    </div></div>`;
  el.querySelectorAll('.strip span').forEach((x, i) => x.classList.toggle('on', i === Math.min(step, r.steps.length - 1)));
}

function render() {
  const max = Math.max(runs.A?.steps.length ?? 0, runs.B?.steps.length ?? 0);
  document.getElementById('at').textContent = max ? `step ${Math.min(step + 1, max)} of ${max}` : '';
  show('A'); show('B');
}

async function load(side, id) {
  const r = await (await fetch(`/api/runs/${encodeURIComponent(id)}`)).json();
  runs[side] = r;
  const el = document.getElementById(side);
  el.innerHTML = card(r);
  el.querySelector('.strip').innerHTML = r.steps.map((s, i) => `<span data-i="${i}" title="${esc(s.label)}" style="background:${COLORS[s.label] ?? '#555'}"></span>`).join('');
  el.querySelector('.strip').onclick = e => { const i = e.target.dataset.i; if (i != null) { step = Number(i); render(); } };
  render();
}

const max = () => Math.max(runs.A?.steps.length ?? 0, runs.B?.steps.length ?? 0);
document.getElementById('prev').onclick = () => { step = Math.max(0, step - 1); render(); };
document.getElementById('next').onclick = () => { step = Math.min(max() - 1, step + 1); render(); };
document.getElementById('play').onclick = e => {
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = 'Play both'; return; }
  e.target.textContent = 'Pause';
  timer = setInterval(() => { if (step >= max() - 1) { clearInterval(timer); timer = null; e.target.textContent = 'Play both'; return; } step++; render(); }, 1500);
};

document.getElementById('legend').innerHTML = Object.entries(COLORS).filter(([l]) => l !== 'none').map(([l, c]) => `<span class="pill" style="background:${c}">${l}</span>`).join('');

(async () => {
  const list = await (await fetch('/api/runs')).json();
  const opt = r => `<option value="${r.id}">Player ${esc(r.persona)}${r.age && !PUBLIC ? ` (${r.age})` : ''}${r.described ? ', described' : ''}, ${esc(r.game)}, ${r.steps ?? '?'} steps</option>`;
  for (const side of ['A', 'B']) {
    const sel = document.getElementById('pick' + side);
    sel.innerHTML = list.map(opt).join('');
    sel.onchange = () => load(side, sel.value);
  }
  const q = new URLSearchParams(location.search);
  const a = q.get('a') ?? list.find(r => r.persona === 'A')?.id, b = q.get('b') ?? list.find(r => r.persona === 'B')?.id;
  if (a) { document.getElementById('pickA').value = a; await load('A', a); }
  if (b) { document.getElementById('pickB').value = b; await load('B', b); }
})();
</script>
</body>
</html>
