<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Camera spike</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  label { display: inline-block; margin: 4px 12px 4px 0; }
  select, input, button { font: inherit; }
  button { padding: 6px 14px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
  .pane { background: #222; padding: 6px; border-radius: 6px; }
  .pane video { width: 100%; aspect-ratio: 16/9; background: #000; }
  .pane b { display: block; margin-bottom: 4px; }
  #verdict { font-size: 20px; font-weight: 700; margin: 12px 0; }
  .pass { color: #5d5; } .fail { color: #f66; }
  pre { background: #222; padding: 8px; max-height: 320px; overflow: auto; }
</style>
</head>
<body>
<h1>Camera spike</h1>
<p>Records both cameras, the mic and a screen share, then checks for dropped frames.</p>
<div>
  <label>Face camera <select id="face"></select></label>
  <label>Hands camera <select id="hands"></select></label>
  <label>Mic <select id="mic"></select></label>
</div>
<div>
  <label>Face <input id="faceRes" value="1280x720@30" size="12"></label>
  <label>Hands <input id="handsRes" value="640x480@30" size="12"></label>
  <label>Minutes <input id="minutes" type="number" value="10" min="0.25" step="0.25" style="width:5em"></label>
  <button id="start">Start</button>
  <button id="stop" disabled>Stop early</button>
  <span id="clock"></span>
</div>
<div id="verdict"></div>
<div class="grid">
  <div class="pane"><b>Face <span id="face-fps"></span></b><video id="v-face" muted playsinline></video></div>
  <div class="pane"><b>Hands <span id="hands-fps"></span></b><video id="v-hands" muted playsinline></video></div>
  <div class="pane"><b>Screen <span id="screen-fps"></span></b><video id="v-screen" muted playsinline></video></div>
  <div class="pane"><b>Mic</b><meter id="level" min="0" max="1" style="width:100%"></meter><pre id="log"></pre></div>
</div>
<script src="/recorder.js"></script>
<script>
const $ = id => document.getElementById(id);
const log = msg => { $('log').textContent += msg + '\n'; };
const parseRes = s => { const m = s.match(/(\d+)x(\d+)@(\d+)/); return { width: +m[1], height: +m[2], fps: +m[3] }; };

async function fillDevices() {
  const { cameras, mics } = await PW.listDevices();
  for (const [sel, list] of [[$('face'), cameras], [$('hands'), cameras], [$('mic'), mics]]) {
    sel.innerHTML = list.map(d => `<option value="${d.deviceId}">${d.label || d.deviceId.slice(0, 8)}</option>`).join('');
  }
  // Default: built-in camera faces the kid, the USB camera watches the hands.
  const builtIn = cameras.find(c => /MacBook|FaceTime/i.test(c.label));
  const usb = cameras.find(c => c !== builtIn);
  if (builtIn) $('face').value = builtIn.deviceId;
  if (usb) $('hands').value = usb.deviceId;
  const usbMic = mics.find(m => /Anker|PowerConf/i.test(m.label));
  if (usbMic) $('mic').value = usbMic.deviceId;
  if (cameras.length < 2) log(`Only ${cameras.length} camera(s) found.`);
}

let running = null;

async function start() {
  if ($('face').value === $('hands').value) { alert('Pick two different cameras.'); return; }
  $('start').disabled = true; $('verdict').textContent = ''; $('log').textContent = '';
  const want = { face: parseRes($('faceRes').value), hands: parseRes($('handsRes').value), screen: { fps: 30 } };
  const streams = {
    face: await PW.openCamera($('face').value, want.face),
    hands: await PW.openCamera($('hands').value, want.hands),
    screen: await PW.openScreen(),
    mic: await PW.openMic($('mic').value),
  };
  const counters = {};
  for (const k of ['face', 'hands', 'screen']) {
    const v = $('v-' + k); v.srcObject = streams[k]; await v.play();
    counters[k] = PW.frameCounter(v);
  }
  // Mic level meter, so a dead mic shows up before ten minutes are wasted.
  const ctx = new AudioContext(), an = ctx.createAnalyser(), buf = new Float32Array(an.fftSize);
  ctx.createMediaStreamSource(streams.mic).connect(an);
  let micPeak = 0;

  const { id } = await (await fetch('/api/sessions', { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ kid: 'spike', game: 'cameras', round: 'test' }) })).json();
  log(`Session ${id}`);
  const recs = {};
  for (const k of Object.keys(streams)) recs[k] = PW.startTrackRecorder(id, k, streams[k]);

  const samples = [], t0 = Date.now(), ms = Number($('minutes').value) * 60000;
  const sample = () => {
    const row = { s: Math.round((Date.now() - t0) / 1000) };
    for (const k of ['face', 'hands', 'screen']) {
      const st = streams[k].getVideoTracks()[0].stats;
      row[k] = { fps: +counters[k].fps().toFixed(1), frames: counters[k].total(),
        ...(st ? { delivered: st.deliveredFrames, discarded: st.discardedFrames, total: st.totalFrames } : {}) };
    }
    row.bytes = Object.fromEntries(Object.entries(recs).map(([k, r]) => [k, r.stats().bytes]));
    samples.push(row);
  };
  const tick = setInterval(() => {
    an.getFloatTimeDomainData(buf);
    const lvl = Math.max(...buf.map(Math.abs)); micPeak = Math.max(micPeak, lvl); $('level').value = lvl;
    for (const k of ['face', 'hands', 'screen']) $(k + '-fps').textContent = counters[k].fps().toFixed(1) + ' fps';
    const left = Math.max(0, ms - (Date.now() - t0));
    $('clock').textContent = `${Math.floor(left / 60000)}:${String(Math.floor(left / 1000) % 60).padStart(2, '0')} left`;
    if (left === 0) finish();
  }, 200);
  const sampler = setInterval(sample, 1000);
  sample();

  async function finish() {
    if (!running) return;
    running = null; clearInterval(tick); clearInterval(sampler); sample();
    $('stop').disabled = true;
    await Promise.all(Object.values(recs).map(r => r.stop()));
    Object.values(streams).forEach(s => s.getTracks().forEach(t => t.stop()));
    ctx.close();
    const report = buildReport(id, want, streams, recs, samples, micPeak);
    await fetch(`/api/sessions/${id}/json/report`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(report) });
    $('verdict').textContent = report.pass ? 'PASS' : 'FAIL: ' + report.problems.join('; ');
    $('verdict').className = report.pass ? 'pass' : 'fail';
    log(JSON.stringify(report.summary, null, 2));
    $('start').disabled = false;
  }
  running = { finish };
  $('stop').disabled = false;
}

function buildReport(id, want, streams, recs, samples, micPeak) {
  const problems = [], summary = {};
  // Ignore the first 3 seconds while cameras warm up.
  const steady = samples.filter(r => r.s >= 3);
  for (const k of ['face', 'hands', 'screen']) {
    const settings = streams[k].getVideoTracks()[0].getSettings();
    const target = want[k].fps === 30 && k === 'screen' ? null : Math.min(want[k].fps, settings.frameRate || want[k].fps);
    const fps = steady.map(r => r[k].fps);
    const avg = fps.reduce((a, b) => a + b, 0) / Math.max(1, fps.length);
    const lowSecs = target ? fps.filter(f => f < target * 0.5).length : 0;
    const last = samples.at(-1)[k];
    const discardPct = last.total ? 100 * last.discarded / last.total : null;
    summary[k] = { width: settings.width, height: settings.height, fpsTarget: target, fpsAvg: +avg.toFixed(1),
      fpsMin: fps.length ? Math.min(...fps) : 0, lowSecs, discardPct: discardPct == null ? null : +discardPct.toFixed(2),
      bytes: recs[k].stats().bytes, mimeType: recs[k].mimeType };
    // Screen share only sends frames when the screen changes, so it gets no fps rule.
    if (target && avg < target * 0.9) problems.push(`${k} averaged ${avg.toFixed(1)} of ${target} fps`);
    if (target && lowSecs > 5) problems.push(`${k} below half speed for ${lowSecs}s`);
    // Chrome skips screen frames when nothing changes, so discards there are expected.
    if (k !== 'screen' && discardPct != null && discardPct > 1) problems.push(`${k} discarded ${discardPct.toFixed(1)}% of frames`);
  }
  summary.mic = { bytes: recs.mic.stats().bytes, peak: +micPeak.toFixed(3) };
  if (micPeak < 0.01) problems.push('mic heard nothing');
  for (const [k, r] of Object.entries(recs)) if (r.stats().error) problems.push(`${k} upload: ${r.stats().error}`);
  return { id, pass: problems.length === 0, problems, summary, samples, userAgent: navigator.userAgent };
}

$('start').onclick = () => start().catch(err => { log('Error: ' + err.message); $('start').disabled = false; });
$('stop').onclick = () => running && running.finish();
fillDevices().catch(err => log('Device error: ' + err.message));
</script>
</body>
</html>
